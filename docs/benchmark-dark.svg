<text x="622.0" y="658.0" font-size="17" fill="#ffffff" font-weight="600" text-anchor="start">How it was measured</text>
<text x="622.0" y="684.0" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="start">Each library runs in its own process and resolves the same</text>
<text x="622.0" y="703.0" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="start">values, so none can win by handing back a lazy object. All</text>
<text x="622.0" y="722.0" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="start">three agree on every result — the script checks.</text>
<text x="622.0" y="741.0" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="start">GitPython shells out to git; pygit2 wraps libgit2; this</text>
<text x="622.0" y="760.0" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="start">binding calls gix in-process.</text>
<text x="48.0" y="836.0" font-size="12.5" fill="#898781" font-weight="400" text-anchor="start">GitPython 3.1.62, pygit2 1.20.0, gitoxide-python 0.4.0 · Python 3.14.7 · git version 2.52.0 · Apple M2</text>
<text x="48.0" y="854.0" font-size="12.5" fill="#898781" font-weight="400" text-anchor="start">python/cpython @ 83360b5 (2026-03-21) · median of up to 7 runs · reproduce with benchmarks/bench.py</text>
